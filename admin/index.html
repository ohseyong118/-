<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d6b4d">
<title>오세용 활동사진 관리자</title>
<link rel="stylesheet" href="/assets/admin-mobile.css">
</head>
<body>
<main class="shell">
  <section id="login" class="login-card">
    <div class="logo">오</div>
    <h1>활동사진 관리자</h1>
    <p>등록된 Google 계정으로 로그인하세요.</p>
    <button id="loginBtn" class="primary">Google로 로그인</button>
    <p id="loginMsg" class="msg"></p>
  </section>

  <section id="panel" class="hidden">
    <header class="topbar">
      <div>
        <small>OHSEYONG ADMIN</small>
        <h1>오늘의 활동 올리기</h1>
        <p id="userEmail"></p>
      </div>
      <button id="logoutBtn" class="outline">로그아웃</button>
    </header>

    <form id="postForm" class="card">
      <label>활동 날짜
        <input id="date" type="date" required>
      </label>

      <label>프로그램 분류
        <select id="category" required>
          <option>인지활동</option>
          <option>미술활동</option>
          <option>음악활동</option>
          <option>신체활동</option>
          <option>여가활동</option>
          <option>생신잔치</option>
          <option>특별행사</option>
          <option>식사</option>
        </select>
      </label>

      <label>제목
        <input id="title" type="text" maxlength="80" placeholder="예: 어르신과 함께한 미술 프로그램" required>
      </label>

      <label>짧은 설명
        <textarea id="summary" rows="3" maxlength="250" placeholder="홈페이지 목록에 표시될 설명" required></textarea>
      </label>

      <label>자세한 내용
        <textarea id="content" rows="6" placeholder="활동 내용과 어르신 반응을 작성해 주세요."></textarea>
      </label>

      <label class="photo-picker">
        <span>사진 선택</span>
        <input id="photos" type="file" accept="image/*" multiple required>
        <b>휴대폰 갤러리에서 최대 8장</b>
      </label>

      <div id="preview" class="preview"></div>

      <button id="publishBtn" class="primary" type="submit">게시하기</button>
      <progress id="progress" class="hidden" max="100" value="0"></progress>
      <p id="status" class="msg"></p>
    </form>

    <section class="card">
      <h2>최근 게시물</h2>
      <div id="recent"></div>
    </section>
  </section>
</main>
<script type="module" src="/assets/admin-github.js"></script>
</body>
</html>
